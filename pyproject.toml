[project]
name = "abstain-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Trivikram", email = "gsstrivikram18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.16.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.5",

[project]
name = "abstain-rag"
version = "1.0.0"
description = "Benchmark of abstention for retrieval-augmented generation: when should a RAG system refuse?"
readme = "README.md"
authors = [
    { name = "Trivikram Sridevi", email = "gsstrivikram18@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["rag", "retrieval", "abstention", "llm-evaluation", "llm-as-judge", "faiss", "embeddings", "far"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.16.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "tqdm>=4.70.1",
]

[project.urls]
Repository = "https://github.com/gss-18/abstain-rag"
Issues = "https://github.com/gss-18/abstain-rag/issues"
Changelog = "https://github.com/gss-18/abstain-rag/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
